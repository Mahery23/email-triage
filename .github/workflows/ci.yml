name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Lint
        run: uv run --locked --no-build ruff check .

      - name: Check formatting
        run: uv run --locked --no-build ruff format --check .

      - name: Type check
        run: uv run --locked --no-build mypy src tests

      - name: Test
        run: uv run --locked --no-build pytest
