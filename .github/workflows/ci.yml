name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Lint
        run: uv run --locked --no-build ruff check .

      - name: Check formatting
        run: uv run --locked --no-build ruff format --check .

      - name: Type check
        run: uv run --locked --no-build mypy src tests

      - name: Test
        run: uv run --locked --no-build pytest
