[project]
name = "email-triage"
version = "0.1.0"
description = "Customer email triage with a fine-tuned BERT model: auto-replies, human review loop, spike alerts, and full MLOps pipeline (Docker, CI/CD, retraining)."
readme = "README.md"
authors = [
    { name = "Mahery23", email = "rasoanaivo.mahery2306@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
]

[project.scripts]
email-triage = "email_triage:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=email_triage --cov-report=term-missing"